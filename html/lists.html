<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Styling Lists</title>
	<link rel="stylesheet" href="../css/lists.css">
</head>
<body>
	
  	<main>
		<div>
		    <h1 id="top">Unordered Lists</h1>
		    <ul> 
			      <li>Athens</li>
			      <li>Rome</li>
			      <li>London</li>
			      <li>Dublin</li>
		    </ul>
	  </div>

	  <div>
		    <h2 id="ordered">Ordered Lists</h2>
		    <ol> 
			      <li>Apples</li>
			      <li>Bananas</li>
			      <li>Kumquats</li>
			      <li>Olives</li>
		    </ol>
	  </div>
		</main>
		
	<a href="#top">Back to Top</a>

</body>
</html>
